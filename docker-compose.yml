services:
  git_mcp_server:
    image: registry.cn-hangzhou.aliyuncs.com/redgreat/git_mcp_server:latest
    container_name: git_mcp_server
    hostname: git_mcp_server
    init: true
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yml
    volumes:
      - ./config:/app/config:ro
      - ./data/git_repos:/data/git_repos
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
