<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" sizes="64x64" />
    <title>Git MCP Server - 管理后台</title>
    <!-- 提前设置主题，避免刷新闪烁 -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
